version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # Matches minimumReleaseAge in pnpm-workspace.yaml: let fresh releases settle first.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Versions chosen by the Expo SDK. React Native refuses to start when react does
      # not exactly match its bundled renderer, so update these only with
      # `expo install --fix` (CI enforces this with `expo install --check`).
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: '@shopify/react-native-skia'
      # Pinned to the copy that @shopify/react-native-skia depends on.
      - dependency-name: canvaskit-wasm
      # Major versions must follow Expo and typescript-eslint support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Must match the Node.js major in .node-version.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
